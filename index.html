<script>
  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        // Stagger children
        const children = entry.target.querySelectorAll('.pain-card, .intel-card, .metric-box, .timeline-step, .testi-card, .price-item, .nudge');
        children.forEach((child, i) => {
          setTimeout(() => child.classList.add('visible'), i * 80);
        });
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal, .pain-grid, .intel-grid, .metrics-row, .timeline, .testi-grid, .pricing-row, .nudge-list').forEach(el => {
    observer.observe(el);
  });

  // Also observe individual animated children
  document.querySelectorAll('.pain-card, .intel-card, .metric-box, .timeline-step, .testi-card, .price-item, .nudge').forEach(el => {
    observer.observe(el);
  });

  // Nav scroll effect
  window.addEventListener('scroll', () => {
    const nav = document.querySelector('nav');
    if (window.scrollY > 60) {
      nav.style.borderBottomColor = 'rgba(241,145,32,0.2)';
    } else {
      nav.style.borderBottomColor = 'rgba(241,145,32,0.12)';
    }
  });
</script>
